name: CI

on:
  push:
    branches: [test_ci]
  pull_request:
    branches: [test_ci]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: make test

  trigger-jenkins:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins deploy
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/joi-delivery/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"