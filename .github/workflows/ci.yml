name: CI

on:
  push:
    branches: [test_ci]
  pull_request:
    branches: [test_ci]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'   # pins to go.mod version
          cache: true                  # caches modules

      - run: make test

  trigger-jenkins:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/test_ci'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins deploy
        run: |
          CRUMB=$(curl -sf \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            | jq -r '.crumb')

          curl --fail -X POST \
            "${{ secrets.JENKINS_URL }}/job/joi-delivery/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            -H "Jenkins-Crumb: $CRUMB"